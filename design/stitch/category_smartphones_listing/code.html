<script>
        // Simple Micro-interaction for filter chips
        document.querySelectorAll('button.rounded-full').forEach(btn => {
            btn.addEventListener('click', function() {
                if (!this.innerText.includes('Sort')) {
                    document.querySelectorAll('button.rounded-full').forEach(b => {
                        if (!b.innerText.includes('Sort')) {
                            b.classList.remove('bg-primary', 'text-on-primary');
                            b.classList.add('border-primary', 'text-primary');
                        }
                    });
                    this.classList.remove('border-primary', 'text-primary');
                    this.classList.add('bg-primary', 'text-on-primary');
                }
            });
        });

        // Favorite Toggle
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            if (icon.textContent === 'favorite') {
                icon.parentElement.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
                    icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
                    icon.style.color = isFilled ? '' : '#000000';
                });
            }
        });
