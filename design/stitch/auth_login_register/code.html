<script>
        function toggleAuth(mode) {
            const loginSection = document.getElementById('login-section');
            const registerSection = document.getElementById('register-section');

            if (mode === 'register') {
                loginSection.style.opacity = '0';
                loginSection.style.transform = 'translateY(-10px)';
                
                setTimeout(() => {
                    loginSection.classList.add('hide-section');
                    registerSection.classList.remove('hide-section');
                    // Force reflow
                    registerSection.offsetHeight;
                    registerSection.style.opacity = '1';
                    registerSection.style.transform = 'translateY(0)';
                }, 400);
            } else {
                registerSection.style.opacity = '0';
                registerSection.style.transform = 'translateY(10px)';
                
                setTimeout(() => {
                    registerSection.classList.add('hide-section');
                    loginSection.classList.remove('hide-section');
                    // Force reflow
                    loginSection.offsetHeight;
                    loginSection.style.opacity = '1';
                    loginSection.style.transform = 'translateY(0)';
                }, 400);
            }
        }

        // Initialize state
        window.addEventListener('load', () => {
            const loginSection = document.getElementById('login-section');
            loginSection.style.opacity = '1';
            loginSection.style.transform = 'translateY(0)';
        });

        // Form Submission Intercept (Visual Feedback Only)
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerText;
                btn.innerText = 'PROCESSING...';
                btn.disabled = true;
                btn.style.opacity = '0.7';
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    alert('Authenticated successfully. Welcome to ESTUDIO.');
                }, 1500);
            });
        });
    </script>
